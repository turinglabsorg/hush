[package]
name = "hush"
version = "0.7.1"
edition = "2021"
license = "MIT"
description = "Agent-blind secrets: ingest over Bitwarden, store with age, use by name"
repository = "https://github.com/turinglabsorg/hush"
homepage = "https://github.com/turinglabsorg/hush"
readme = "README.md"
keywords = ["secrets", "bitwarden", "age", "cli", "agents"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
aes-gcm = "0.10"
age = "0.11"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2.9"
hmac = "0.12"
rand = "0.8"
rsa = { version = "0.9", features = ["pem", "sha2"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2", features = ["json"] }
url = "2"
zeroize = { version = "1", features = ["std"] }

[dev-dependencies]
tempfile = "3"
